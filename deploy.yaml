apiVersion: apps/v1
kind: Deployment
metadata:
 name: nginx-deployment
 labels:
   app: nginx
spec:
 replicas: 3
 selector:
   matchLabels:
     app: nginx
 template:
   metadata:
     labels:
       app: nginx
   spec:
     containers:
     - name: nginx
       image: nginx:1.14.2
       ports:
       - containerPort: 80       
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
  labels:
    app: nginx
spec:
  type: NodePort  # Change to LoadBalancer if using cloud provider
  selector:
    app: nginx
  ports:
    - protocol: TCP
      port: 80       # Service port
      targetPort: 80 # Container port
      nodePort: 30080 # Optional: External port (30000–32767)
