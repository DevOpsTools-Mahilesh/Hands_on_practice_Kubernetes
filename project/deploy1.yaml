apiVersion: apps/v1
kind: Deployment
metadata:
 name: nginx-deployment-one
 labels:
   app: mginx1
spec:
 replicas: 1
 selector:
   matchLabels:
     app: nginx1
 template:
   metadata:
     labels:
       app: nginx1
   spec:
     containers:
     - name: nginx1
       image: nginx:1.14.2
       ports:
       - containerPort: 80       
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
  labels:
    app: nginx1
spec:
  type: NodePort  # Change to LoadBalancer if using cloud provider
  selector:
    app: nginx1
  ports:
    - protocol: TCP
      port: 80       # Service port
      targetPort: 80 # Container port
      nodePort: 30080 # Optional: External port (30000–32767)
